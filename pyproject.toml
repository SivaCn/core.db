[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "core-db"
version = "0.1.0"
description = "Database wraper and models package"
authors = [{ name = "Siva Cn", email = "siva@getyellow.in" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.7"
dependencies = []

[tool.setuptools]
packages = ["core.db"]

[project.scripts]
db-migrate = "core.db.cli:apply_migrations"
